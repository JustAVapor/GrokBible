<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.55" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#1b0f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="1380" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8e0"/>
      <stop offset="0.25" stop-color="#ffe7a6"/>
      <stop offset="0.6" stop-color="#d9a446"/>
      <stop offset="1" stop-color="#5a3a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="800" cy="1380" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98f3a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3c96b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.45" stop-color="#d4a84b"/>
      <stop offset="0.7" stop-color="#b8862e"/>
      <stop offset="1" stop-color="#f1d58a"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.5" stop-color="#d4a84b"/>
      <stop offset="1" stop-color="#a87623"/>
    </linearGradient>
    <linearGradient id="curtL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a0c2e"/>
      <stop offset="0.12" stop-color="#5b1440"/>
      <stop offset="0.22" stop-color="#3a0d33"/>
      <stop offset="0.36" stop-color="#7a1a3c"/>
      <stop offset="0.48" stop-color="#46102f"/>
      <stop offset="0.62" stop-color="#8c2240"/>
      <stop offset="0.76" stop-color="#511236"/>
      <stop offset="0.9" stop-color="#9a2a44"/>
      <stop offset="1" stop-color="#c9764a"/>
    </linearGradient>
    <linearGradient id="curtR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2a0c2e"/>
      <stop offset="0.12" stop-color="#5b1440"/>
      <stop offset="0.22" stop-color="#3a0d33"/>
      <stop offset="0.36" stop-color="#7a1a3c"/>
      <stop offset="0.48" stop-color="#46102f"/>
      <stop offset="0.62" stop-color="#8c2240"/>
      <stop offset="0.76" stop-color="#511236"/>
      <stop offset="0.9" stop-color="#9a2a44"/>
      <stop offset="1" stop-color="#c9764a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="anchorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a10"/>
      <stop offset="1" stop-color="#140c14"/>
    </linearGradient>
    <clipPath id="opening"><rect x="330" y="760" width="940" height="1250"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="2560" fill="url(#bg)"/>
  <rect width="1600" height="2560" fill="url(#halo)"/>

  <!-- faint stars -->
  <g fill="#f6e3a1" opacity="0.55">
    <circle cx="180" cy="300" r="2.2"/><circle cx="260" cy="520" r="1.6"/><circle cx="1400" cy="260" r="2"/>
    <circle cx="1460" cy="560" r="1.5"/><circle cx="1330" cy="420" r="1.2"/><circle cx="140" cy="660" r="1.4"/>
    <circle cx="420" cy="140" r="1.3"/><circle cx="1180" cy="150" r="1.6"/><circle cx="1500" cy="720" r="1.8"/>
    <circle cx="110" cy="2200" r="1.5"/><circle cx="1490" cy="2150" r="1.7"/><circle cx="230" cy="2420" r="1.2"/>
    <circle cx="1380" cy="2440" r="1.3"/>
  </g>

  <!-- the lit opening behind the curtain -->
  <g clip-path="url(#opening)">
    <rect x="330" y="760" width="940" height="1250" fill="#3a2410"/>
    <rect x="330" y="760" width="940" height="1250" fill="url(#glow)"/>
    <!-- rays -->
    <g stroke="#fff4cf" stroke-opacity="0.18" stroke-width="6">
      <line x1="800" y1="1380" x2="330" y2="760"/><line x1="800" y1="1380" x2="560" y2="760"/>
      <line x1="800" y1="1380" x2="800" y2="760"/><line x1="800" y1="1380" x2="1040" y2="760"/>
      <line x1="800" y1="1380" x2="1270" y2="760"/><line x1="800" y1="1380" x2="330" y2="1380"/>
      <line x1="800" y1="1380" x2="1270" y2="1380"/><line x1="800" y1="1380" x2="330" y2="2010"/>
      <line x1="800" y1="1380" x2="1270" y2="2010"/><line x1="800" y1="1380" x2="600" y2="2010"/>
      <line x1="800" y1="1380" x2="1000" y2="2010"/>
    </g>
  </g>

  <!-- curtain rod / lintel -->
  <rect x="290" y="728" width="1020" height="34" rx="6" fill="url(#gold)"/>
  <rect x="290" y="728" width="1020" height="34" rx="6" fill="none" stroke="#6b4a17" stroke-width="2"/>
  <g fill="url(#gold)" stroke="#6b4a17" stroke-width="2">
    <circle cx="300" cy="745" r="26"/><circle cx="1300" cy="745" r="26"/>
  </g>

  <!-- left curtain, drawn aside -->
  <path d="M 330 762 L 760 762 C 690 960, 610 1180, 585 1390 C 570 1520, 600 1600, 640 1660 C 590 1700, 560 1800, 540 2010 L 330 2010 Z" fill="url(#curtL)"/>
  <path d="M 330 762 L 760 762 C 690 960, 610 1180, 585 1390 C 570 1520, 600 1600, 640 1660 C 590 1700, 560 1800, 540 2010 L 330 2010 Z" fill="url(#shade)"/>
  <!-- right curtain -->
  <path d="M 1270 762 L 840 762 C 910 960, 990 1180, 1015 1390 C 1030 1520, 1000 1600, 960 1660 C 1010 1700, 1040 1800, 1060 2010 L 1270 2010 Z" fill="url(#curtR)"/>
  <path d="M 1270 762 L 840 762 C 910 960, 990 1180, 1015 1390 C 1030 1520, 1000 1600, 960 1660 C 1010 1700, 1040 1800, 1060 2010 L 1270 2010 Z" fill="url(#shade)"/>
  <!-- blue hem (blue, purple, scarlet — Exod 26:31) -->
  <path d="M 760 762 C 690 960, 610 1180, 585 1390 C 570 1520, 600 1600, 640 1660 C 590 1700, 560 1800, 540 2010" stroke="#3f63b5" stroke-width="9" fill="none" opacity="0.9"/>
  <path d="M 840 762 C 910 960, 990 1180, 1015 1390 C 1030 1520, 1000 1600, 960 1660 C 1010 1700, 1040 1800, 1060 2010" stroke="#3f63b5" stroke-width="9" fill="none" opacity="0.9"/>

  <!-- floor line -->
  <rect x="290" y="2008" width="1020" height="10" fill="url(#gold)" opacity="0.9"/>

  <!-- ANCHOR (with crossbar forming a cross) -->
  <g transform="translate(800,0)">
    <g fill="url(#anchorFill)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round">
      <!-- ring -->
      <path d="M 0 1010 a 52 52 0 1 1 -0.1 0 Z M 0 1040 a 22 22 0 1 0 0.1 0 Z" fill-rule="evenodd"/>
      <!-- stock (crossbar) -->
      <rect x="-150" y="1120" width="300" height="40" rx="18"/>
      <!-- shank -->
      <rect x="-22" y="1104" width="44" height="640" rx="10"/>
      <!-- arms -->
      <path d="M -26 1700 C -120 1700, -210 1650, -255 1560 L -300 1590 L -262 1470 L -170 1540 L -212 1556 C -180 1615, -110 1650, -26 1652 Z"/>
      <path d="M 26 1700 C 120 1700, 210 1650, 255 1560 L 300 1590 L 262 1470 L 170 1540 L 212 1556 C 180 1615, 110 1650, 26 1652 Z"/>
      <!-- crown -->
      <path d="M -40 1690 L 40 1690 L 0 1770 Z"/>
    </g>
  </g>

  <!-- outer frame -->
  <rect x="56" y="56" width="1488" height="2448" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="76" y="76" width="1448" height="2408" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.8"/>
  <g fill="url(#gold)">
    <path d="M 56 56 m 0 -14 l 14 14 l -14 14 l -14 -14 Z"/>
    <path d="M 1544 56 m 0 -14 l 14 14 l -14 14 l -14 -14 Z"/>
    <path d="M 56 2504 m 0 -14 l 14 14 l -14 14 l -14 -14 Z"/>
    <path d="M 1544 2504 m 0 -14 l 14 14 l -14 14 l -14 -14 Z"/>
  </g>

  <!-- TITLE BLOCK -->
  <text x="800" y="205" text-anchor="middle" font-family="Gentium Plus" font-size="50" letter-spacing="14" fill="#d9b768">ΠΡΟΣ ΕΒΡΑΙΟΥΣ</text>
  <text x="800" y="430" text-anchor="middle" font-family="Cinzel SB" font-size="200" letter-spacing="16" fill="url(#goldv)">HEBREWS</text>
  <g stroke="#d4a84b" stroke-width="3">
    <line x1="430" y1="492" x2="760" y2="492"/><line x1="840" y1="492" x2="1170" y2="492"/>
  </g>
  <path d="M 800 476 l 16 16 l -16 16 l -16 -16 Z" fill="url(#gold)"/>
  <text x="800" y="585" text-anchor="middle" font-family="EBG I" font-size="66" fill="#efe2c0">A Verse-by-Verse Study</text>
  <text x="800" y="660" text-anchor="middle" font-family="EBG I" font-size="50" fill="#cdbb93">from the Original Languages</text>

  <!-- EPIGRAPH -->
  <text text-anchor="middle" font-family="EBG I" font-size="50" fill="#efe2c0">
    <tspan x="800" y="2140">“We have this hope as an anchor of the soul,</tspan>
    <tspan x="800" y="2205">sure and steadfast, entering into the inner place</tspan>
    <tspan x="800" y="2270">behind the curtain.”</tspan>
  </text>
  <text x="800" y="2345" text-anchor="middle" font-family="Cinzel R" font-size="38" letter-spacing="6" fill="#d4a84b">HEBREWS 6:19</text>
</svg>
